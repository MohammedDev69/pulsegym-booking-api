# Copy this to docker-compose.yml in your project root and adjust it.
# We start your app with:   docker compose up --build
# and expect the API on http://localhost:8080
services:
  app:
    build: .            # your Dockerfile (start from one in templates/)
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pulse:pulse@db:5432/pulsegym
    depends_on:
      db:
        condition: service_healthy
  # Optional: use any database you like, or none. Delete this if you don't need it.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulsegym
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 2s
      retries: 30
