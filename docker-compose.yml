# PulseGym booking API.
#
#   docker compose up --build   ->  http://localhost:8080
#
# The application waits for PostgreSQL, creates its schema, and only then starts
# listening, so /health is a real readiness signal.

services:
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pulse:pulse@db:5432/pulsegym
      PORT: "8080"
      PG_POOL_MAX: "20"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulsegym
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulsegym"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # Data survives container restarts; `docker compose down -v` resets it.
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
